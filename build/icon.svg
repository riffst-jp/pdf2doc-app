<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFA"/>
      <stop offset="1" stop-color="#2A2F8F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1FB"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#E5394B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1040" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" filterUnits="userSpaceOnUse" x="380" y="600" width="320" height="200">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#9A1B2B" flood-opacity="0.35"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS squircle plate (824px within 1024 canvas) -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  </g>

  <!-- back page -->
  <g filter="url(#shadow)" transform="rotate(-9 512 512)">
    <rect x="290" y="250" width="380" height="490" rx="34" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>

  <!-- front page with folded corner -->
  <g filter="url(#shadow)">
    <path d="M384 270 H600 L730 400 V738 a34 34 0 0 1 -34 34 H384 a34 34 0 0 1 -34 -34 V304 a34 34 0 0 1 34 -34 Z" fill="url(#page)"/>
  </g>
  <path d="M600 270 V366 a34 34 0 0 0 34 34 H730 Z" fill="#C9D2F5"/>

  <!-- text lines -->
  <g fill="#C3CBEA">
    <rect x="404" y="330" width="150" height="22" rx="11" fill="#5B7CFA"/>
    <rect x="404" y="430" width="272" height="18" rx="9"/>
    <rect x="404" y="474" width="272" height="18" rx="9"/>
    <rect x="404" y="518" width="220" height="18" rx="9"/>
    <rect x="404" y="562" width="252" height="18" rx="9"/>
  </g>

  <!-- page number badge -->
  <g filter="url(#badgeShadow)">
    <rect x="440" y="640" width="200" height="86" rx="43" fill="url(#badge)"/>
  </g>
  <g fill="#FFFFFF">
    <!-- "1" -->
    <path d="M478 664 L494 656 H506 V712 H490 V672 L478 678 Z"/>
    <!-- "-" -->
    <rect x="520" y="679" width="24" height="12" rx="6"/>
    <!-- "2" -->
    <g transform="translate(-6 0)"><path d="M562 670 C564 660 572 655 584 655 C598 655 607 663 607 674 C607 684 601 690 591 698 L582 705 H608 V712 H562 V701 L583 684 C589 679 591 676 591 672 C591 667 588 664 584 664 C580 664 577 667 576 672 Z"/></g>
  </g>
</svg>
